<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Bills Payable Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0d0f14;--surface:#161921;--border:#252934;--muted:#3a3f50;
  --text:#e8eaf0;--dim:#7b8099;
  --red:#ff4d4d;--red-bg:#1f1215;--red-dim:#7a1a1a;
  --orange:#ff8c42;--orange-bg:#1a140d;
  --yellow:#f5c542;--yellow-bg:#181508;
  --green:#4ade80;--green-bg:#0d1f12;
  --blue:#60a5fa;--blue-bg:#0d1526;
  --az:#38bdf8;--az-bg:#0d1e2e;
  --nt:#a78bfa;--nt-bg:#160e2e;
  --navy:#1e3a5f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden;}

.header{background:linear-gradient(135deg,#0d1526 0%,#161028 100%);border-bottom:1px solid var(--border);padding:16px 16px 0;position:sticky;top:0;z-index:100;}
.header-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.header h1{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;line-height:1.2;}
.header h1 span{color:var(--blue);}
.date-badge{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;white-space:nowrap;flex-shrink:0;}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;}
.kpi-label{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.kpi-value{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;}
.kpi.total .kpi-value{color:var(--blue);}.kpi.overdue .kpi-value{color:var(--red);}
.kpi.due .kpi-value{color:var(--orange);}.kpi.coming .kpi-value{color:var(--yellow);}
.tab-row{display:flex;gap:0;border-bottom:1px solid var(--border);}
.tab-btn{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.4px;padding:8px 16px;background:none;border:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn.az.active{color:var(--az);border-bottom-color:var(--az);}
.tab-btn.nt.active{color:var(--nt);border-bottom-color:var(--nt);}
.seg-bar{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;}
.seg-bar::-webkit-scrollbar{display:none;}
.seg-btn{font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--dim);cursor:pointer;white-space:nowrap;transition:all .15s;}
.seg-btn.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);}
.section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px;}
.cards{padding:0 16px 90px;display:flex;flex-direction:column;gap:8px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;}
.card.overdue{border-left:3px solid var(--red);}.card.due{border-left:3px solid var(--orange);}
.card.coming{border-left:3px solid var(--yellow);}.card.current{border-left:3px solid var(--muted);}
.card-main{padding:11px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.card-left{flex:1;min-width:0;}
.card-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;}
.pill{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px;}
.pill-az{background:var(--az-bg);color:var(--az);border:1px solid #1a3a5a;}
.pill-nt{background:var(--nt-bg);color:var(--nt);border:1px solid #2a1a5a;}
.pill-normal{background:#141a1a;color:#4ade80;border:1px solid #1a3a1a;}
.pill-cash{background:#1a1505;color:var(--yellow);border:1px solid #3a3005;}
.pill-sister{background:#1a1225;color:var(--nt);border:1px solid #2a1a4a;}
.card-right{text-align:right;flex-shrink:0;}
.card-total{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.card-pdc{font-family:'DM Mono',monospace;font-size:10px;color:var(--green);margin-top:2px;}
.card-badge{font-family:'DM Mono',monospace;font-size:9px;padding:2px 8px;border-radius:10px;margin-top:4px;display:inline-block;}
.badge-overdue{background:var(--red-bg);color:var(--red);border:1px solid var(--red-dim);}
.badge-due{background:var(--orange-bg);color:var(--orange);border:1px solid #4a2a0a;}
.badge-coming{background:var(--yellow-bg);color:var(--yellow);border:1px solid #3a2a05;}
.badge-current{background:#111520;color:var(--dim);border:1px solid var(--border);}
.aging-bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);}
.aging-cell{padding:6px 8px;border-right:1px solid var(--border);text-align:center;}
.aging-cell:last-child{border-right:none;}
.aging-cell-label{font-family:'DM Mono',monospace;font-size:7.5px;color:var(--dim);text-transform:uppercase;margin-bottom:2px;}
.aging-cell-val{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;}
.a-overdue .aging-cell-val{color:var(--red);}.a-due .aging-cell-val{color:var(--orange);}
.a-coming .aging-cell-val{color:var(--yellow);}.a-current .aging-cell-val,.a-zero .aging-cell-val{color:var(--muted);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#11141d;border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:201;max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom,16px);}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:var(--muted);border-radius:2px;margin:12px auto 0;}
.drawer-header{padding:14px 18px 10px;}
.drawer-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:6px;}
.drawer-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.drawer-sec{padding:0 18px 16px;}
.drawer-sec-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.amount-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px;}
.amount-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.amount-box-label{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.amount-box-val{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
.ab-total .amount-box-val{color:var(--text);}.ab-od .amount-box-val{color:var(--red);}
.ab-pdc .amount-box-val{color:var(--green);}.ab-net .amount-box-val{color:var(--blue);}
.month-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #1e2230;}
.month-row:last-child{border-bottom:none;}
.month-lbl{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);width:56px;}
.month-bw{flex:1;margin:0 8px;height:4px;background:var(--border);border-radius:2px;}
.month-bf{height:4px;border-radius:2px;}
.month-val{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;text-align:right;min-width:68px;}
.pdc-card{background:var(--green-bg);border:1px solid #1a3a1a;border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.pdc-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.pdc-chq{font-family:'DM Mono',monospace;font-size:11px;color:var(--green);font-weight:500;}
.pdc-amt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--green);}
.pdc-desc{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pdc-sheet{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px;}

.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 36px);margin:0 18px 16px;padding:13px;border:none;border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;}
.share-btn:active{opacity:.8;transform:scale(.98);}
.share-btn:disabled{opacity:.5;cursor:not-allowed;}

.footer-totals{position:fixed;bottom:0;left:0;right:0;background:#0d1526;border-top:1px solid var(--border);padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;z-index:50;}
.ft-chip{flex:1;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 4px;}
.ft-label{font-family:'DM Mono',monospace;font-size:7px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;}
.ft-val{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;margin-top:2px;}
.ft-total .ft-val{color:var(--blue);}.ft-ov .ft-val{color:var(--red);}
.ft-due .ft-val{color:var(--orange);}.ft-cm .ft-val{color:var(--yellow);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}

/* PDF LOADING OVERLAY */
.pdf-loading{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.pdf-loading.show{display:flex;}
.pdf-spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.15);border-top-color:#4ade80;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pdf-loading-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.pdf-loading-sub{font-family:'DM Mono',monospace;font-size:11px;color:#a8c0d8;letter-spacing:.4px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-row1">
    <h1>Bills <span>Payable</span><br>Dashboard</h1>
    <div class="date-badge" id="date-badge"></div>
  </div>
  <div class="kpi-strip">
    <div class="kpi total"><div class="kpi-label">Total</div><div class="kpi-value" id="k-total">—</div></div>
    <div class="kpi overdue"><div class="kpi-label">Overdue</div><div class="kpi-value" id="k-ov">—</div></div>
    <div class="kpi due"><div class="kpi-label">Due</div><div class="kpi-value" id="k-du">—</div></div>
    <div class="kpi coming"><div class="kpi-label">Coming</div><div class="kpi-value" id="k-cm">—</div></div>
  </div>
  <div class="tab-row">
    <button class="tab-btn active" onclick="setCompany('ALL',this)">ALL</button>
    <button class="tab-btn az"     onclick="setCompany('AZAIBA',this)">AZAIBA</button>
    <button class="tab-btn nt"     onclick="setCompany('NATIONAL',this)">NATIONAL</button>
  </div>
</div>

<div class="seg-bar">
  <button class="seg-btn active" onclick="setSeg('NORMAL',this)">Normal Only</button>
  <button class="seg-btn"        onclick="setSeg('NORMAL+SISTER',this)">Normal + Sister</button>
  <button class="seg-btn"        onclick="setSeg('ALL',this)">All</button>
</div>

<div class="section-label" id="sec-label">Normal Segment</div>
<div class="cards" id="cards"></div>

<div class="footer-totals">
  <div class="ft-chip ft-total"><div class="ft-label">Showing</div><div class="ft-val" id="ft-tot">—</div></div>
  <div class="ft-chip ft-ov"><div class="ft-label">Overdue</div><div class="ft-val" id="ft-ov">—</div></div>
  <div class="ft-chip ft-due"><div class="ft-label">Due</div><div class="ft-val" id="ft-du">—</div></div>
  <div class="ft-chip ft-cm"><div class="ft-label">Coming</div><div class="ft-val" id="ft-cm">—</div></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-name" id="d-name"></div>
    <div class="drawer-meta" id="d-meta"></div>
  </div>
  <button class="share-btn" id="share-btn" onclick="shareStatement()">
    📤 &nbsp;Share Statement (WhatsApp / Save)
  </button>
  <div class="drawer-sec">
    <div class="drawer-sec-title">Amounts</div>
    <div class="amount-grid">
      <div class="amount-box ab-total"><div class="amount-box-label">Total Outstanding</div><div class="amount-box-val" id="d-total"></div></div>
      <div class="amount-box ab-od"><div class="amount-box-label">Overdue</div><div class="amount-box-val" id="d-od"></div></div>
      <div class="amount-box ab-pdc"><div class="amount-box-label">PDC Given</div><div class="amount-box-val" id="d-pdc"></div></div>
      <div class="amount-box ab-net"><div class="amount-box-label">Net Outstanding</div><div class="amount-box-val" id="d-net"></div></div>
    </div>
  </div>
  <div class="drawer-sec" id="d-pdc-sec" style="display:none">
    <div class="drawer-sec-title">PDC Cheques Pending</div>
    <div id="d-pdc-list"></div>
  </div>
  <div class="drawer-sec">
    <div class="drawer-sec-title">Monthly Breakdown</div>
    <div id="d-months"></div>
  </div>
</div>

<div class="pdf-loading" id="pdf-loading">
  <div class="pdf-spinner"></div>
  <div class="pdf-loading-title">Building PDF…</div>
  <div class="pdf-loading-sub" id="pdf-loading-sub">Preparing statement</div>
</div>

function render(){
  const f=getFiltered();
  const tot=DATA.reduce((s,d)=>s+d.total,0),ov=DATA.reduce((s,d)=>s+d.overdue,0),
        du=DATA.reduce((s,d)=>s+d.due,0),cm=DATA.reduce((s,d)=>s+d.coming,0);
  document.getElementById('k-total').textContent=fmtS(tot);
  document.getElementById('k-ov').textContent=fmtS(ov);
  document.getElementById('k-du').textContent=fmtS(du);
  document.getElementById('k-cm').textContent=fmtS(cm);
  document.getElementById('date-badge').textContent=TODAY_STR;
  const ft=f.reduce((s,d)=>s+d.total,0),fo=f.reduce((s,d)=>s+d.overdue,0),
        fd=f.reduce((s,d)=>s+d.due,0),fc=f.reduce((s,d)=>s+d.coming,0);
  document.getElementById('ft-tot').textContent=fmtS(ft);
  document.getElementById('ft-ov').textContent=fmtS(fo);
  document.getElementById('ft-du').textContent=fmtS(fd);
  document.getElementById('ft-cm').textContent=fmtS(fc);
  const cont=document.getElementById('cards');
  if(!f.length){cont.innerHTML=`<div class="empty">No creditors match this filter</div>`;return;}
  const agingCell=(lbl,val,cls)=>{
    const zc=val>0?'':' a-zero';
    return`<div class="aging-cell ${cls}${zc}"><div class="aging-cell-label">${lbl}</div><div class="aging-cell-val">${val>0?fmtN(val):'–'}</div></div>`;
  };
  cont.innerHTML=f.map(d=>{
    const gi=DATA.indexOf(d);
    const pdcNote=d.pdc>0?`<div class="card-pdc">PDC ${fmtN(d.pdc)} | Net ${fmtN(d.net)}</div>`:'';
    return`<div class="card ${d.status.toLowerCase()}" onclick="openDrawer(${gi})">
      <div class="card-main">
        <div class="card-left"><div class="card-name">${d.name}</div><div class="card-meta">${coPill(d.company)}${segPill(d.segment)}</div></div>
        <div class="card-right"><div class="card-total">${fmtN(d.total)}</div>${pdcNote}${badge(d.status)}</div>
      </div>
      <div class="aging-bar">
        ${agingCell('Overdue',d.overdue,'a-overdue')}${agingCell('Due',d.due,'a-due')}
        ${agingCell('Coming',d.coming,'a-coming')}${agingCell('Current',d.current,'a-current')}
      </div>
    </div>`;
  }).join('');
}

function openDrawer(idx){
  activeIdx=idx; const d=DATA[idx];
  document.getElementById('d-name').textContent=d.name;
  document.getElementById('d-meta').innerHTML=coPill(d.company)+segPill(d.segment);
  document.getElementById('d-total').textContent=fmtN(d.total);
  document.getElementById('d-od').textContent=d.overdue>0?fmtN(d.overdue):'–';
  document.getElementById('d-pdc').textContent=d.pdc>0?fmtN(d.pdc):'–';
  document.getElementById('d-net').textContent=fmtN(d.net);
  const pdcSec=document.getElementById('d-pdc-sec');
  if(d.pdcs&&d.pdcs.length){
    pdcSec.style.display='block';
    document.getElementById('d-pdc-list').innerHTML=d.pdcs.map(p=>`
      <div class="pdc-card">
        <div class="pdc-card-top"><span class="pdc-chq">CHQ # ${p.chq}</span><span class="pdc-amt">${fmtN(p.amt)}</span></div>
        <div class="pdc-desc">${p.desc}</div><div class="pdc-sheet">Sheet: ${p.sheet}</div>
      </div>`).join('');
  } else { pdcSec.style.display='none'; }
  const maxV=Math.max(...MONTH_LABELS.map(m=>d.months[m]||0),d.abv,0.01);
  const barColors={OVERDUE:'#ff4d4d',DUE:'#ff8c42',COMING:'#f5c542',CURRENT:'#3a3f50'};
  const bucketOf=i=>{const a=[0,16,46,76,107,136,167][i]||0;return a>120?'OVERDUE':a>90?'DUE':a>=60?'COMING':'CURRENT';};
  let mhtml='';
  MONTH_LABELS.forEach((m,i)=>{
    const v=d.months[m]||0,pct=Math.round((v/maxV)*100),bkt=bucketOf(i),col=barColors[bkt];
    mhtml+=`<div class="month-row"><div class="month-lbl">${m}</div>
      <div class="month-bw"><div class="month-bf" style="width:${v>0?Math.max(pct,2):0}%;background:${col}"></div></div>
      <div class="month-val" style="color:${v>0?col:'var(--muted)'}">${v>0?fmtN(v):'–'}</div></div>`;
  });
  if(d.abv>0){const pct=Math.round((d.abv/maxV)*100);
    mhtml+=`<div class="month-row"><div class="month-lbl" style="color:var(--red)">ABV 6M</div>
      <div class="month-bw"><div class="month-bf" style="width:${Math.max(pct,2)}%;background:var(--red-dim)"></div></div>
      <div class="month-val" style="color:var(--red)">${fmtN(d.abv)}</div></div>`;}
  document.getElementById('d-months').innerHTML=mhtml;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow='';
}

// ═══════════════════════════════════════════════════════════
// PDF GENERATION — pure jsPDF + autoTable, no html2canvas
// ═══════════════════════════════════════════════════════════
function buildPDF(d) {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});

  const W=210, H=297, M=10, CW=190;

  // Color palette
  const NAVY    = [31,56,100];
  const NAVY_LT = [232,238,248];
  const RED     = [192,0,0];
  const RED_BG  = [255,220,220];
  const ORA     = [220,100,0];
  const ORA_BG  = [255,230,195];
  const AMB     = [160,110,0];
  const AMB_BG  = [255,248,205];
  const GRAY    = [170,182,195];
  const GRAY_BG = [245,247,250];
  const GRN     = [27,94,32];
  const GRN_BG  = [225,245,225];
  const WHITE   = [255,255,255];
  const TEXT    = [50,50,50];
  const DIM     = [107,122,153];
  const BORD    = [210,215,225];
  const FOOT_BG = [240,244,250];

  const sf = c=>doc.setFillColor(...c);
  const sd = c=>doc.setDrawColor(...c);
  const st = c=>doc.setTextColor(...c);
  const bo = sz=>{doc.setFont('helvetica','bold'); doc.setFontSize(sz);};
  const no = sz=>{doc.setFont('helvetica','normal'); doc.setFontSize(sz);};
  const tx = (s,x,y,align='left')=>doc.text(String(s??''),x,y,{align});
  const bktBg  = b=>({OVERDUE:RED_BG, DUE:ORA_BG, COMING:AMB_BG, CURRENT:GRAY_BG}[b]||GRAY_BG);
  const bktTxt = b=>({OVERDUE:RED, DUE:ORA, COMING:AMB, CURRENT:DIM}[b]||DIM);

  const tot = d.total, ov = d.overdue, pdc = d.pdc, net = d.net;
  const notOv = Math.max(0, tot-ov);
  const co = CO_INFO[d.company];
  const firstDate = d.invoices.length ? d.invoices[0].date : '—';
  const lastDate  = d.invoices.length ? d.invoices[d.invoices.length-1].date : '—';
  const nm = d.name.length>58 ? d.name.substring(0,55)+'...' : d.name;

  // ── reusable header block ────────────────────────────────────────
  function header(subtitle) {
    let y=0;
    // Navy bar
    sf(NAVY); doc.rect(0,y,W,28,'F');
    bo(11); st(WHITE); tx(co.name, M, y+10);
    no(6.5); st([168,192,216]);
    const det=[co.cr, co.addr, co.vatin].filter(Boolean).join('  |  ');
    tx(det, M, y+16);
    bo(9); st(WHITE);   tx('STATEMENT OF ACCOUNT', W-M, y+9, 'right');
    no(7); st([168,192,216]); tx('Payables — '+subtitle, W-M, y+15, 'right');
    st([100,165,250]);         tx('As of '+TODAY_STR,      W-M, y+22, 'right');
    y+=28;

    // Creditor bar
    sf(NAVY_LT); doc.rect(0,y,W,18,'F');
    no(6.5); st(DIM); tx('SUPPLIER / CREDITOR', M, y+5.5);
    bo(10); st(NAVY);
    tx(nm, M, y+12);
    no(6.5); st(DIM);
    const coLbl = d.company==='AZAIBA' ? 'GLOBAL ORYX — AZAIBA' : 'NATIONAL TYRES';
    tx(`${coLbl}  |  Segment: ${d.segment}`, M, y+17);
    no(7.5); st(TEXT);
    tx('Statement Date: '+TODAY_STR, W-M, y+8, 'right');
    tx('Period: '+firstDate+' to '+lastDate, W-M, y+14, 'right');
    y+=18;

    // KPI row — 5 boxes
    const kw=CW/5;
    const kpis=[
      ['TOTAL OUTSTANDING', f3(tot),  NAVY, NAVY_LT],
      ['OVERDUE',           f3(ov),   RED,  RED_BG],
      ['NOT OVERDUE',       f3(notOv),GRN,  GRN_BG],
      ['PDC GIVEN',         f3(pdc),  GRN,  GRN_BG],
      ['NET BALANCE',       f3(net),  NAVY, NAVY_LT],
    ];
    kpis.forEach(([lbl,val,tc,bg],i)=>{
      const kx=M+i*kw;
      sf(bg); doc.rect(kx,y,kw,20,'F');
      if(i>0){sd(BORD); doc.line(kx,y,kx,y+20);}
      no(6); st(DIM);   tx(lbl, kx+kw/2, y+5.5, 'center');
      bo(9); st(tc);    tx(val, kx+kw/2, y+13,   'center');
      no(6); st(DIM);   tx('OMR', kx+kw/2, y+18, 'center');
    });
    sd(BORD); doc.line(M,y+20,M+CW,y+20);
    y+=20;

    // Aging visual bar
    const base = tot||1;
    const ovP=ov/base, duP=d.due/base, cmP=d.coming/base, cuP=Math.max(0,1-ovP-duP-cmP);
    sf(GRAY_BG); doc.rect(M,y+3,CW,5,'F');
    let ax=M;
    if(ovP>0){sf(RED);   doc.rect(ax,y+3,CW*ovP,5,'F'); ax+=CW*ovP;}
    if(duP>0){sf(ORA);   doc.rect(ax,y+3,CW*duP,5,'F'); ax+=CW*duP;}
    if(cmP>0){sf([220,175,0]); doc.rect(ax,y+3,CW*cmP,5,'F'); ax+=CW*cmP;}
    if(cuP>0){sf(GRAY);  doc.rect(ax,y+3,CW*cuP,5,'F');}
    no(6.5); let lx=M;
    const legs=[];
    if(ov>0)      legs.push([RED,    `Overdue >120d: OMR ${ov.toFixed(3)}`]);
    if(d.due>0)   legs.push([ORA,    `Due 90-120d: OMR ${d.due.toFixed(3)}`]);
    if(d.coming>0)legs.push([AMB,    `Coming 60-89d: OMR ${d.coming.toFixed(3)}`]);
    if(d.current>0)legs.push([GRAY,  `Current <60d: OMR ${d.current.toFixed(3)}`]);
    legs.forEach(([col,lbl])=>{
      sf(col); doc.rect(lx,y+10,3.5,3.5,'F');
      st(TEXT); tx(lbl,lx+5,y+14); lx+=doc.getTextWidth(lbl)+11;
    });
    y+=20;
    return y;
  }

  // ── section bar ─────────────────────────────────────────────────
  function secBar(y,lbl,pg){
    sf(NAVY); doc.rect(0,y,W,8,'F');
    no(7); st([168,192,216]); tx(lbl.toUpperCase(),M,y+5.5);
    st([100,165,250]);         tx(pg,W-M,y+5.5,'right');
    return y+8;
  }

  // ── page footer ──────────────────────────────────────────────────
  function footer(pg,tot_pg){
    const fy=H-8;
    sf(FOOT_BG); doc.rect(0,fy,W,8,'F');
    sd(BORD); doc.line(0,fy,W,fy);
    no(7); st(DIM);
    tx(`Page ${pg} of ${tot_pg}  |  ${co.name}`,M,fy+5);
    tx('Printed: '+TODAY_STR,W-M,fy+5,'right');
  }

  const TOTAL_PG = 3;

  // ════════════════════════════════════════════════════════
  // PAGE 1 — MONTHLY SUMMARY
  // ════════════════════════════════════════════════════════
  let y = header('Monthly Summary');
  y = secBar(y, 'Outstanding by Month', 'Page 1 of 3');

  let cumul=0;
  const mBody = d.month_summary.map(m=>{
    cumul=Math.round((cumul+m.amount)*1000)/1000;
    return [m.month, m.bucket, m.age_range, f3(m.amount), f3(cumul)];
  });

  doc.autoTable({
    startY: y, margin:{left:M,right:M},
    head:[['Month','Aging Bucket','Age Range','Amount (OMR)','Cumulative (OMR)']],
    body: mBody,
    foot:[['','','TOTAL OUTSTANDING',f3(tot),'—']],
    showFoot:'lastPage',
    tableLineWidth:0.4, tableLineColor:NAVY,
    styles:{lineWidth:0.2, lineColor:BORD},
    headStyles:{fillColor:NAVY_LT,textColor:DIM,fontStyle:'bold',fontSize:7,
                lineColor:NAVY,lineWidth:0.4},
    bodyStyles:{fontSize:8.5,textColor:TEXT,cellPadding:2.5},
    footStyles:{fillColor:NAVY_LT,textColor:NAVY,fontStyle:'bold',fontSize:8.5,
                lineColor:NAVY,lineWidth:0.5},
    columnStyles:{
      0:{cellWidth:28,fontStyle:'bold'},
      1:{cellWidth:38},
      2:{cellWidth:32},
      3:{cellWidth:46,halign:'right'},
      4:{cellWidth:46,halign:'right'}
    },
    alternateRowStyles:{fillColor:[245,247,250]},
    didParseCell:function(data){
      if(data.section==='body'&&data.column.index===1){
        const b=data.cell.raw;
        data.cell.styles.fillColor=bktBg(b);
        data.cell.styles.textColor=bktTxt(b);
        data.cell.styles.fontStyle='bold';
      }
    }
  });
  footer(1,TOTAL_PG);

  // ════════════════════════════════════════════════════════
  // PAGE 2 — INVOICE DETAIL
  // ════════════════════════════════════════════════════════
  doc.addPage();
  y = header('Invoice Detail');
  y = secBar(y, `All Invoices — Oldest to Newest (${d.invoices.length})`, 'Page 2 of 3');

  const iBody = d.invoices.map(inv=>[inv.date, inv.ref, inv.name, f3(inv.amount), inv.bucket, inv.age+'d']);

  doc.autoTable({
    startY:y, margin:{left:M,right:M},
    head:[['Date','Reference No.','Party Name','Amount (OMR)','Bucket','Age']],
    body:iBody,
    foot:[['','','TOTAL OUTSTANDING',f3(tot),'','']],
    showFoot:'lastPage',
    tableLineWidth:0.4, tableLineColor:NAVY,
    styles:{lineWidth:0.2, lineColor:BORD},
    headStyles:{fillColor:NAVY_LT,textColor:DIM,fontStyle:'bold',fontSize:7,
                lineColor:NAVY,lineWidth:0.4},
    bodyStyles:{fontSize:7.5,textColor:TEXT,cellPadding:2},
    footStyles:{fillColor:NAVY_LT,textColor:NAVY,fontStyle:'bold',fontSize:8,
                lineColor:NAVY,lineWidth:0.5},
    columnStyles:{
      0:{cellWidth:22},
      1:{cellWidth:40},
      2:{cellWidth:62},
      3:{cellWidth:32,halign:'right'},
      4:{cellWidth:22,halign:'center'},
      5:{cellWidth:12,halign:'center'}
    },
    alternateRowStyles:{fillColor:[245,247,250]},
    didDrawPage:function(data){
      if(data.pageNumber>1){
        sf(NAVY); doc.rect(0,0,W,10,'F');
        no(7); st([168,192,216]);
        tx(`${co.name}  |  Invoice Detail (cont.)  |  ${nm}`,M,7);
      }
      footer(2,TOTAL_PG);
    },
    didParseCell:function(data){
      if(data.section==='body'&&data.column.index===4){
        const b=data.cell.raw;
        data.cell.styles.fillColor=bktBg(b);
        data.cell.styles.textColor=bktTxt(b);
        data.cell.styles.fontStyle='bold';
      }
    }
  });

  // ════════════════════════════════════════════════════════
  // PAGE 3 — PDC DETAILS
  // ════════════════════════════════════════════════════════
  doc.addPage();
  y = header('PDC Cheques Given');
  y = secBar(y, 'Post-Dated Cheques Issued — Pending Clearance', 'Page 3 of 3');

  if(d.pdcs.length===0){
    no(9); st(DIM); tx('No post-dated cheques issued for this supplier.',M,y+12);
    y+=25;
  } else {
    // Intro strip
    sf(GRN_BG); doc.rect(M,y+3,CW,10,'F');
    sf([76,175,80]); doc.rect(M,y+3,2.5,10,'F');
    no(7.5); st(TEXT);
    tx('Cheques issued to this supplier — pending clearance from bank. Deducted from net balance.',M+5,y+9.5);
    y+=17;

    const pdcBody = d.pdcs.map(p=>[`CHQ # ${p.chq}`, p.desc.substring(0,42), p.sheet, f3(p.amt), 'PENDING']);
    doc.autoTable({
      startY:y, margin:{left:M,right:M},
      head:[['Cheque No.','Description','Sheet','Amount (OMR)','Status']],
      body:pdcBody,
      tableLineWidth:0.4, tableLineColor:GRN,
      styles:{lineWidth:0.2, lineColor:[180,220,180]},
      headStyles:{fillColor:GRN,textColor:WHITE,fontStyle:'bold',fontSize:7,lineWidth:0.4,lineColor:GRN},
      bodyStyles:{fontSize:8.5,textColor:TEXT,cellPadding:3,fillColor:GRN_BG},
      columnStyles:{
        0:{cellWidth:34,textColor:GRN,fontStyle:'bold'},
        1:{cellWidth:72},
        2:{cellWidth:20,halign:'center'},
        3:{cellWidth:36,halign:'right',textColor:GRN,fontStyle:'bold'},
        4:{cellWidth:24,halign:'center',textColor:GRN,fontStyle:'bold'}
      }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  // Net balance bar — near bottom
  const nbY = Math.min(Math.max(y, H-50), H-42);
  sf(NAVY); doc.rect(0,nbY,W,28,'F');
  no(7.5); st([168,192,216]);
  tx('NET BALANCE  (Total Outstanding – PDC Given)',M,nbY+9);
  no(7); st([168,192,216]);
  tx(`OMR ${f3(tot)}  –  OMR ${f3(pdc)}  =  OMR ${f3(net)}`,M,nbY+16);
  bo(18); st(WHITE);
  tx(`OMR ${f3(net)}`,W-M,nbY+20,'right');

  footer(3,TOTAL_PG);
  return doc;
}

// ── SHARE ──────────────────────────────────────────────────────────
async function shareStatement(){
  if(activeIdx===null) return;
  const d = DATA[activeIdx];
  const btn = document.getElementById('share-btn');
  const loading = document.getElementById('pdf-loading');
  const sub = document.getElementById('pdf-loading-sub');

  btn.disabled=true;
  loading.classList.add('show');
  sub.textContent='Building 3-page statement…';

  try {
    await new Promise(r=>setTimeout(r,60)); // let UI update
    const doc = buildPDF(d);

    sub.textContent='Preparing file…';
    await new Promise(r=>setTimeout(r,40));

    const credName = d.name.replace(/[^a-zA-Z0-9]/g,'_').substring(0,25);
    const fileName = `Payable_${credName}_${TODAY_STR.replace(/ /g,'_')}.pdf`;
    const blob = doc.output('blob');
    const file = new File([blob], fileName, {type:'application/pdf'});

    loading.classList.remove('show');

    // Try native share sheet first (opens WhatsApp, email, etc.)
    // Falls back to direct download if browser doesn't support file sharing
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file],
        title:`Payable Statement — ${d.name}`,
        text:`Bills Payable Statement as of ${TODAY_STR}`
      });
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=fileName; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
  } catch(err){
    loading.classList.remove('show');
    console.error(err);
    alert('PDF error: ' + err.message);
  } finally {
    loading.classList.remove('show');
    btn.disabled=false;
  }
}

// Swipe drawer to close
let ty=0;
document.getElementById('drawer').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;});
document.getElementById('drawer').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>80)closeDrawer();});

render();
</script>
